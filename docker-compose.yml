services:
  mariadb-server:
    image: mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword123
      MARIADB_DATABASE: demo
      MARIADB_USER: user
      MARIADB_PASSWORD: password123
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p'rootpassword123'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  mariadb-mcp:
    build: .
    container_name: mariadb-mcp
    env_file: .env
    environment:
      DB_HOST: mariadb-server
      DB_PORT: "3306"
      DB_USER: user
      DB_PASSWORD: password123
      DB_NAME: demo
    ports:
      - "9101:9101"
    depends_on:
      mariadb-server:
        condition: service_healthy
